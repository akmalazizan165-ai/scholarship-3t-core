name: Evidence Quality Gate & Multi-Platform Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema requests

      - name: Execute Pytest Suite
        run: pytest tests/ -v

  sync:
    name: Synchronize Evidence Releases
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Multi-Platform Clients
        run: |
          python -m pip install --upgrade pip
          pip install requests qdrant-client neo4j

      - name: Sync 3T Demographics to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/kaggle_etl.py

      - name: Sync 1024-dim BGE-M3 Embeddings to Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python3 scripts/qdrant_sync.py

      - name: Apply Cypher Migrations to Neo4j AuraDB
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python3 scripts/neo4j_sync.py

      - name: Push Documentation to Miraheze MediaWiki
        env:
          WIKI_API_URL: ${{ secrets.WIKI_API_URL }}
          WIKI_USER: ${{ secrets.WIKI_USER }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
        run: python3 scripts/wiki_sync.py
